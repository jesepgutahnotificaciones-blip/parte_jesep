<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Novedades - Policía Nacional de Colombia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --verde-policia: #01592F;
            --azul-oscuro: #173E56;
            --amarillo-policia: #C9A227;
            --blanco: #FFFFFF;
            --gris-fondo: #F0F2F5;
            --gris-suave: #E8EAED;
            --gris-texto: #5F6368;
            --gris-oscuro: #3C4043;
            --borde: #DADCE0;
            --rojo-error: #D93025;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            color: var(--gris-oscuro);
            background-image: url('https://raw.githubusercontent.com/jesepgutahnotificaciones-blip/RADICADOS_JESEP/main/1-fescol-policia-abuso-cilives-1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: var(--gris-fondo);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(1,89,47,0.85) 0%,
                rgba(23,62,86,0.85) 100%
            );
            z-index: -1;
        }

        /* ===== LOGIN SCREEN ===== */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(1,89,47,0.95) 0%,
                rgba(23,62,86,0.95) 100%
            );
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        .login-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .login-card {
            background: var(--blanco);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-card img {
            width: 80px;
            margin-bottom: 20px;
        }

        .login-card h2 {
            color: var(--verde-policia);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            color: var(--gris-texto);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--borde);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--verde-policia);
        }

        .input-group label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gris-texto);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            pointer-events: none;
            background: var(--blanco);
            padding: 0 4px;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 0.75rem;
            color: var(--verde-policia);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--verde-policia) 0%, var(--azul-oscuro) 100%);
            color: var(--blanco);
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(1,89,47,0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login-secondary {
            background: var(--gris-texto);
            color: var(--blanco);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login-secondary:hover {
            background: var(--gris-oscuro);
        }

        .login-error {
            color: var(--rojo-error);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: var(--blanco);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dep-name {
            color: var(--verde-policia);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* ===== HEADER CON USUARIO ===== */
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--blanco);
            font-size: 0.85rem;
        }

        .user-badge {
            background: var(--amarillo-policia);
            color: var(--azul-oscuro);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: var(--blanco);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,0.3);
        }

        /* ===== RESTO DE ESTILOS ===== */
        .header-institutional {
            background: linear-gradient(135deg, #01592F 0%, #173E56 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-left img {
            width: 50px;
        }

        .header-text h1 {
            font-size: 1.2rem;
        }

        .subtitle {
            color: #C9A227;
            font-size: .85rem;
        }

        .main-content {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 25px;
        }

        .welcome-section {
            background: rgba(255,255,255,.95);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
        }

        .welcome-section h2 {
            color: #01592F;
            margin-bottom: 10px;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .btn-dependency {
            background: rgba(255,255,255,.95);
            border: 2px solid #DADCE0;
            padding: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
            font-weight: 600;
            position: relative;
        }

        .btn-dependency:hover {
            transform: translateY(-3px);
            border-color: #01592F;
        }

        .btn-dependency:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-dependency.hidden {
            display: none;
        }

        .icon {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .name {
            display: block;
            color: #01592F;
            font-weight: bold;
        }

        .type {
            display: block;
            font-size: .75rem;
            color: #5F6368;
            margin-top: 5px;
        }

        .footer-institutional {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: linear-gradient(135deg, #01592F 0%, #173E56 100%);
            color: white;
        }

        .motto {
            color: #C9A227;
            margin-top: 10px;
        }

        @media(max-width:768px) {
            .buttons-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .login-card {
                padding: 30px 20px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card" id="loginCard">
            <img src="https://www.policia.gov.co/sites/default/files/escudo-policia.png" 
                 alt="Escudo Policía Nacional"
                 onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Coat_of_arms_of_colombian_national_police.svg/120px-Coat_of_arms_of_colombian_national_police.svg.png'">
            <h2>Policía Nacional de Colombia</h2>
            <p class="subtitle">Sistema de Gestión de Novedades</p>
            
            <form class="login-form" id="loginForm" onsubmit="return false;">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required autocomplete="username">
                    <label for="username">Usuario</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                    <label for="password">Contraseña</label>
                </div>
                <button type="submit" class="btn-login" id="btnLogin" onclick="handleLogin()">
                    Ingresar
                </button>
                <div class="login-error" id="loginError"></div>
            </form>
        </div>
    </div>

    <!-- HEADER -->
    <div class="header-institutional">
        <div class="header-left">
            <img src="https://www.policia.gov.co/sites/default/files/escudo-policia.png">
            <div class="header-text">
                <h1>Jefatura Nacional del Servicio de Policía</h1>
                <p class="subtitle">Sistema de Gestión de Novedades</p>
            </div>
        </div>
        <div class="user-info" id="userInfo" style="display:none;">
            <span id="userName"></span>
            <span class="user-badge" id="userRole"></span>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>
        <span id="currentDate"></span>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="welcome-section">
            <h2>🏛️ Seleccione una Dependencia</h2>
            <p id="welcomeText">Seleccione la dependencia para gestionar el registro de novedades</p>
        </div>
        <div class="buttons-grid" id="buttonsContainer"></div>
    </div>

    <!-- FOOTER -->
    <div class="footer-institutional">
        <p>Sistema de Gestión de Novedades</p>
        <p class="motto">★ DIOS Y PATRIA ★</p>
    </div>

    <script>
       
//============================================================
// CONFIG API
//============================================================

const API_URL='https://script.google.com/macros/s/AKfycbwtFfeiHJ0nz3dDV5MqMjZ_Kcq-_-fl9-B1eiqGD9T-_MX0WObyWTDmyWyCG7J_CYga/exec';

let jsonpCallbackId=0;
let usuarioActual=null;


//============================================================
// FECHA
//============================================================

document.getElementById("currentDate").innerHTML=
new Date().toLocaleDateString(
'es-CO',
{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
}
);


//============================================================
// JSONP
//============================================================

function apiFetchJSONP(action,params={}){

return new Promise((resolve,reject)=>{

const callbackName=
'callback_'+(++jsonpCallbackId);

window[callbackName]=function(data){

delete window[callbackName];

if(script.parentNode){
script.parentNode.removeChild(script);
}

resolve(data);

};

const script=document.createElement("script");

let url=
API_URL+
'?action='+
encodeURIComponent(action)+
'&callback='+
callbackName;

Object.keys(params).forEach(key=>{

if(
params[key]!==undefined &&
params[key]!==null
){

url +=
'&'+
encodeURIComponent(key)+
'='+
encodeURIComponent(params[key]);

}

});

script.src=url;

script.onerror=function(){

delete window[callbackName];

reject(
new Error(
'Error de conexión Apps Script'
)
);

};

document.body.appendChild(script);

});

}


//============================================================
// LOGIN
//============================================================

async function handleLogin(){

const user=
document.getElementById(
'username'
).value.trim();

const pass=
document.getElementById(
'password'
).value.trim();

const btn=
document.getElementById(
'btnLogin'
);

const error=
document.getElementById(
'loginError'
);


error.classList.remove(
'show'
);

error.innerText='';


if(!user || !pass){

mostrarError(
'Ingrese usuario y contraseña'
);

return;

}

try{

btn.disabled=true;

btn.innerHTML=
'Validando... <span class="spinner"></span>';

const response=
await apiFetchJSONP(
'login',
{
username:user,
password:pass
}
);

console.log(
'Respuesta login:',
response
);

if(
response &&
response.success &&
response.usuario
){

usuarioActual=
response.usuario;

guardarSesion();

mostrarSistema();

}
else{

mostrarError(
response.error ||
'Usuario o contraseña incorrectos'
);

}

}
catch(err){

console.error(err);

mostrarError(
'Error de conexión'
);

}
finally{

btn.disabled=false;
btn.innerHTML='Ingresar';

}

}


//============================================================
// MOSTRAR SISTEMA
//============================================================

function mostrarSistema(){

document
.getElementById(
'loginOverlay'
)
.classList.add(
'hidden'
);

document
.getElementById(
'userInfo'
)
.style.display='flex';


document
.getElementById(
'userName'
)
innerHTML=
usuarioActual.username;


document
.getElementById(
'userRole'
)
innerHTML=
usuarioActual.rol;


document
.getElementById(
'welcomeText'
)
innerHTML=
'Dependencia asignada: <strong>'+
usuarioActual.dependencia+
'</strong>';

crearBotonDependencia();

}


//============================================================
// BOTÓN DEPENDENCIA
//============================================================

function crearBotonDependencia(){

const container=
document.getElementById(
'buttonsContainer'
);

container.innerHTML='';

const btn=
document.createElement(
'button'
);

btn.className=
'btn-dependency';

btn.innerHTML=
`
<span class="icon">🏛️</span>
<span class="name">${usuarioActual.dependencia}</span>
<span class="type">${usuarioActual.rol}</span>
`;

btn.onclick=function(){

window.location.href=
'panel.html?dependency='+
encodeURIComponent(
usuarioActual.dependencia
);

};

container.appendChild(
btn
);

}


//============================================================
// GUARDAR SESION
//============================================================

function guardarSesion(){

localStorage.setItem(
'usuarioSistema',
JSON.stringify(
usuarioActual
)
);

}


//============================================================
// CARGAR SESION
//============================================================

function cargarSesion(){

const data=
localStorage.getItem(
'usuarioSistema'
);

if(!data)return;

try{

usuarioActual=
JSON.parse(data);

mostrarSistema();

}
catch(e){

localStorage.removeItem(
'usuarioSistema'
);

}

}


//============================================================
// LOGOUT
//============================================================

function logout(){

localStorage.removeItem(
'usuarioSistema'
);

location.reload();

}


//============================================================
// ERROR LOGIN
//============================================================

function mostrarError(msg){

const error=
document.getElementById(
'loginError'
);

error.innerHTML=msg;

error.classList.add(
'show'
);

}


//============================================================
// ENTER LOGIN
//============================================================

document
.getElementById(
'password'
)
.addEventListener(
'keypress',
function(e){

if(
e.key==="Enter"
){

handleLogin();

}

}
);


//============================================================
// INICIO
//============================================================

window.onload=function(){

cargarSesion();

};


    </script>
</body>
</html>
