<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Novedades - Policía Nacional de Colombia</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --verde-policia: #01592F;
            --azul-oscuro: #173E56;
            --amarillo-policia: #C9A227;
            --blanco: #FFFFFF;
            --gris-fondo: #F0F2F5;
            --gris-suave: #E8EAED;
            --gris-texto: #5F6368;
            --gris-oscuro: #3C4043;
            --borde: #DADCE0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            color: var(--gris-oscuro);

            background-image: url('https://raw.githubusercontent.com/jesepgutahnotificaciones-blip/RADICADOS_JESEP/main/1-fescol-policia-abuso-cilives-1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: var(--gris-fondo);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(1,89,47,0.85) 0%,
                rgba(23,62,86,0.85) 100%
            );
            z-index: -1;
        }

        .header-institutional {
            background: linear-gradient(
                135deg,
                #01592F 0%,
                #173E56 100%
            );

            color: white;
            padding:15px 30px;

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .header-left{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .header-left img{
            width:50px;
        }

        .header-text h1{
            font-size:1.2rem;
        }

        .subtitle{
            color:#C9A227;
            font-size:.85rem;
        }

        .main-content{
            max-width:1400px;
            margin:25px auto;
            padding:0 25px;
        }

        .welcome-section{
            background:rgba(255,255,255,.95);
            padding:25px;
            border-radius:12px;
            margin-bottom:25px;
            text-align:center;
        }

        .welcome-section h2{
            color:#01592F;
            margin-bottom:10px;
        }

        .buttons-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
            gap:15px;
        }

        .btn-dependency{
            background:rgba(255,255,255,.95);
            border:2px solid #DADCE0;
            padding:18px;
            border-radius:8px;
            cursor:pointer;
            transition:.3s;
            font-weight:600;
            position:relative;
        }

        .btn-dependency:hover{
            transform:translateY(-3px);
            border-color:#01592F;
        }

        .icon{
            display:block;
            font-size:1.5rem;
            margin-bottom:8px;
        }

        .name{
            display:block;
            color:#01592F;
            font-weight:bold;
        }

        .type{
            display:block;
            font-size:.75rem;
            color:#5F6368;
            margin-top:5px;
        }

        .footer-institutional{
            text-align:center;
            padding:20px;
            margin-top:30px;
            background:linear-gradient(
                135deg,
                #01592F 0%,
                #173E56 100%
            );
            color:white;
        }

        .motto{
            color:#C9A227;
            margin-top:10px;
        }

        @media(max-width:768px){
            .buttons-grid{
                grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
            }
        }

    </style>

</head>
<body>

<div class="header-institutional">

    <div class="header-left">

        <img src="https://www.policia.gov.co/sites/default/files/escudo-policia.png">

        <div class="header-text">
            <h1>Jefatura Nacional del Servicio de Policía</h1>
            <p class="subtitle">
                Sistema de Gestión de Novedades
            </p>
        </div>

    </div>

    <span id="currentDate"></span>

</div>


<div class="main-content">

    <div class="welcome-section">
        <h2>🏛️ Seleccione una Dependencia</h2>
        <p>
            Seleccione la dependencia para gestionar el registro de novedades
        </p>
    </div>

    <div class="buttons-grid" id="buttonsContainer"></div>

</div>


<div class="footer-institutional">

    <p>
        Sistema de Gestión de Novedades
    </p>

    <p class="motto">
        ★ DIOS Y PATRIA ★
    </p>

</div>


<script>

const dependencies=[

'ASJUR',
'CEPOL',
'ARSEG',
'GRUES',
'COINT',
'ARGOP',
'GRUIS',
'GUCOE',
'GUDEH',
'GUFAC',
'GUGEC',
'GUGED',
'GUGET',
'GULOG',
'GURIN',
'GUSEP',
'GUTAH',
'GUTIC',
'GUVIP',
'COVAR',
'OAC',
'PLAN DEMOCRACIA',
'PLANE',
'SEPRI',
'SUMEC',
'SUSEP',
'PARTE FINAL'

];

const container=document.getElementById(
'buttonsContainer'
);

dependencies.forEach(dep=>{

const btn=document.createElement('button');

btn.className='btn-dependency';

btn.innerHTML=`

<span class="icon">🛡️</span>
<span class="name">${dep}</span>
<span class="type">Dependencia</span>

`;

btn.onclick=()=>{

localStorage.setItem(
'currentDependency',
dep
);

// SOLO ESTE BOTÓN REDIRIGE A index_main
if(dep==="PARTE FINAL"){

window.location.href=
'https://jesepgutahnotificaciones-blip.github.io/parte_jesep/index_main.html';

}else{

window.location.href=
'dashboard.html';

}

};

container.appendChild(btn);

});


function updateDate(){

const now=new Date();

const options={

weekday:'long',
year:'numeric',
month:'long',
day:'numeric',
hour:'2-digit',
minute:'2-digit'

};

document.getElementById(
'currentDate'
).textContent=

now.toLocaleDateString(
'es-CO',
options
);

}

updateDate();

</script>

</body>
</html>
