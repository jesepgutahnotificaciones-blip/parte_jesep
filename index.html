<!-- index.html - Página Principal -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Novedades - Dependencias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn-dependency {
            background: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn-dependency:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background: #f8f9fa;
        }
        
        .btn-dependency:active {
            transform: translateY(0);
        }
        
        /* Colores específicos por tipo */
        .btn-dependency[data-type="ASJUR"] { border-left: 5px solid #e74c3c; }
        .btn-dependency[data-type="CEPOL"] { border-left: 5px solid #3498db; }
        .btn-dependency[data-type="OTROS"] { border-left: 5px solid #95a5a6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏛️ Sistema de Registro de Novedades</h1>
        
        <div class="buttons-grid" id="buttonsContainer">
            <!-- Botones se generan automáticamente -->
        </div>
    </div>

    <script>
        const dependencies = [
            'ASJUR', 'CEPOL', 'ARSEG', 'GRUES', 'COINT', 'ARGOP', 
            'GRUIS', 'GUCOE', 'GUDEH', 'GUFAC', 'GUGEC', 'GUGED', 
            'GUGET', 'GULOG', 'GURIN', 'GUSEP', 'GUTAH', 'GUTIC', 
            'GUVIP', 'COVAR', 'OAC', 'PLAN DEMOCRACIA', 'PLANE', 
            'SEPRI', 'SUMEC', 'SUSEP', 'OTROS'
        ];

        const container = document.getElementById('buttonsContainer');
        
        dependencies.forEach(dep => {
            const btn = document.createElement('button');
            btn.className = 'btn-dependency';
            btn.setAttribute('data-type', dep);
            btn.textContent = dep;
            btn.onclick = () => {
                // Guardar dependencia seleccionada y redirigir
                localStorage.setItem('currentDependency', dep);
                window.location.href = 'dashboard.html';
            };
            container.appendChild(btn);
        });
    </script>
</body>
</html>
