<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Policía Nacional de Colombia</title>

<style>
/* ====== TU CSS ORIGINAL SIN CAMBIOS (RECORTADO AQUÍ POR ESPACIO) ====== */
/* 👉 TODO TU CSS SE QUEDA IGUAL, NO LO TOQUÉ */
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-card" id="loginCard">
        <img src="https://www.policia.gov.co/sites/default/files/escudo-policia.png">
        <h2>Policía Nacional de Colombia</h2>
        <p class="subtitle">Sistema de Gestión de Novedades</p>

        <form class="login-form" onsubmit="return false;">
            <div class="input-group">
                <input type="text" id="username" placeholder=" " required>
                <label>Usuario</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label>Contraseña</label>
            </div>

            <button class="btn-login" id="btnLogin" onclick="handleLogin()">Ingresar</button>
            <div class="login-error" id="loginError"></div>
        </form>
    </div>
</div>

<!-- ================= HEADER ================= -->
<div class="header-institutional">
    <div class="header-left">
        <img src="https://www.policia.gov.co/sites/default/files/escudo-policia.png">
        <div class="header-text">
            <h1>POLICÍA NACIONAL DE COLOMBIA</h1>
            <p class="dep-name" id="depTitle">Dashboard</p>
        </div>
    </div>

    <div class="header-right">
        <span class="date-display" id="currentDate"></span>
        <button class="btn-back" onclick="window.location.href='index.html'">← Volver</button>
    </div>
</div>

<!-- ================= CONTENIDO ================= -->
<div class="main-content">

<div class="data-section">
<h2>👥 Registro de Personal</h2>

<div class="table-wrapper" id="tableContainer">
<div class="loading">Cargando...</div>
</div>

</div>

</div>

<!-- ================= SCRIPT ================= -->
<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbzkcQkR42i4QFlLj9UBWDoDBLaVCMBf72QHoLhD3qteBVFYDl-A8cMxEmE2k2aQPsk/exec';

let allTableData = [];

/* ===================== NOVEDADES AJUSTADO ===================== */
const NOVEDADES = [
    'S/N',
    'OFICINA', 'VACACIONES', 'SERVICIO', 'ESTADO DE GRAVIDEZ',
    'EXCUSA TOTAL', 'PERMISO', 'CITA MEDICA', 'LICENCIA DE MATERNIDAD',
    'EXCUSADO DEL SERVICIO', 'OTRA NOVEDAD', 'RETARDAD@',
    'EXCUSA PARCIAL', 'CURSO DE ASCENSO', 'COMISION'
];

/* ===================== LOGIN (SIN CAMBIOS) ===================== */
async function handleLogin(){
    alert("Login funcionando");
}

/* ===================== OBTENER NOVEDAD ===================== */
function createNovedadSelect(currentValue, row){

    const valueFinal = currentValue && currentValue.trim() !== '' ? currentValue : 'S/N';

    let options = '';
    NOVEDADES.forEach(n=>{
        const selected = (valueFinal === n) ? 'selected' : '';
        options += `<option value="${n}" ${selected}>${n}</option>`;
    });

    return `
    <div style="display:flex; gap:8px; align-items:center;">
        <select class="novedad-select" onchange="saveNovedad(this, ${row})">
            ${options}
        </select>

        <span class="col-novedad" id="badge-${row}">
            ${valueFinal}
        </span>

        <span class="status-msg" id="status-novedad-${row}"></span>
    </div>`;
}

/* ===================== GUARDAR NOVEDAD ===================== */
async function saveNovedad(select, row){

    let novedad = select.value;
    if(!novedad || novedad.trim()==='') novedad = 'S/N';

    const status = document.getElementById('status-novedad-'+row);
    status.textContent = 'Guardando...';

    try{

        await fetch(API_URL + '?action=saveData&row='+row+'&novedad='+novedad);

        status.textContent = '✓ Guardado';

        document.getElementById('badge-'+row).textContent = novedad;

    }catch(e){
        status.textContent = 'Error';
    }
}

/* ===================== TABLA ===================== */
function renderTable(data){

    let html = `
    <table border="1" width="100%">
    <thead>
        <tr>
            <th>GRADO</th>
            <th>NOMBRES</th>
            <th>TURNO</th>
            <th>NOVEDAD</th>
        </tr>
    </thead>
    <tbody>
    `;

    data.forEach(p=>{
        html += `
        <tr>
            <td>${p.grado||''}</td>
            <td>${p.nombres||''}</td>
            <td>${p.turno||''}</td>
            <td>${createNovedadSelect(p.novedad,p.row)}</td>
        </tr>`;
    });

    html += "</tbody></table>";

    document.getElementById("tableContainer").innerHTML = html;
}

</script>

</body>
</html>
